<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6f63">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petit Parcours">
<title>Petit Parcours</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: eine ruhige Spalte, immer nur eine Aufgabe sichtbar; Karteibox als Fortschritt */
:root{
  --bg:#eaf1ee; --paper:#fbfdfb; --ink:#17322f; --soft:#587370; --line:#c8d8d3;
  --go:#0f6f63; --go-ink:#ffffff; --un:#1f62b5; --une:#b8325e; --ok:#d9f0dd; --ok-ink:#17613a; --no:#fde8c9; --no-ink:#7d4a00;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Atkinson Hyperlegible",Verdana,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#102321; --paper:#183230; --ink:#e8f3ef; --soft:#a4bdb8; --line:#34514d;
  --go:#58c8b6; --go-ink:#082522; --un:#8bbcf5; --une:#f39ab8; --ok:#1d4a30; --ok-ink:#c8f0d3; --no:#55390e; --no-ink:#ffdfae; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#102321; --paper:#183230; --ink:#e8f3ef; --soft:#a4bdb8; --line:#34514d;
  --go:#58c8b6; --go-ink:#082522; --un:#8bbcf5; --une:#f39ab8; --ok:#1d4a30; --ok-ink:#c8f0d3; --no:#55390e; --no-ink:#ffdfae; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:18px/1.45 var(--body);padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:640px;margin:auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.12}
h1{font-size:2.15rem;font-weight:800} h2{font-size:1.28rem}
p{margin:0}
.muted{color:var(--soft)} .small{font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--un);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:6px 4px;color:var(--soft)}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--go);font-weight:700}
.start{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.big{background:var(--go);color:var(--go-ink);border:0;border-radius:10px;padding:16px 22px;font-weight:700;font-size:1.15rem;min-height:58px}
.plain{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 16px;min-height:48px}
.plain:disabled,.big:disabled{opacity:.5;cursor:default}
.box{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:92px}
.slot{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;min-width:0}
.bar{width:100%;background:var(--go);border-radius:4px 4px 0 0;min-height:3px}
.slot b{font-variant-numeric:tabular-nums;font-size:.9rem}.slot span{font-size:.72rem;color:var(--soft);white-space:nowrap}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.row>div{min-width:0}
.pill{font-size:.8rem;padding:2px 9px;border-radius:99px;background:var(--line);white-space:nowrap}
.pill.done{background:var(--ok);color:var(--ok-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 14px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--go);color:var(--go-ink);border-color:var(--go);font-weight:700}
.head{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:5px;flex:1}.dots i{height:9px;flex:1;background:var(--line);border-radius:3px}.dots i.on{background:var(--go)}
.task{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px 20px;display:flex;flex-direction:column;gap:18px;min-height:390px}
.ask{color:var(--soft);font-weight:700}
.prompt{font:800 clamp(1.7rem,6vw,2.4rem)/1.15 var(--display);overflow-wrap:anywhere}
.un{color:var(--un)}.une{color:var(--une)}
.say{align-self:flex-start;display:inline-flex;gap:8px;align-items:center}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:14px 16px;min-height:58px;font-size:1.1rem;overflow-wrap:anywhere}
.opt.right{background:var(--ok);color:var(--ok-ink);border-color:var(--ok-ink)}
.opt.wrong{background:var(--no);color:var(--no-ink);border-color:var(--no-ink)}
input[type=text]{font:inherit;font-size:1.3rem;width:100%;padding:13px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.accents{display:flex;gap:6px;flex-wrap:wrap}.accents button{min-width:46px;min-height:46px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:54px}.tile{background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:9px 13px;font-size:1.1rem}
.answer{border-bottom:2px dashed var(--line);padding-bottom:8px}
.fb{border-radius:10px;padding:13px 15px;font-weight:700}.fb.ok{background:var(--ok);color:var(--ok-ink)}.fb.no{background:var(--no);color:var(--no-ink)}
.fb small{display:block;font-weight:400;font-size:.95rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}.actions>*{flex:1 1 150px}
.note{font-size:.92rem;color:var(--soft)}
@media (prefers-reduced-motion:no-preference){.bar{transition:height .25s}}
.rule{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.rule ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.rule li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;border-top:1px dashed var(--line);padding-top:6px}
.rules{display:grid;gap:12px;margin-top:10px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pairs>div{display:grid;gap:8px;align-content:start;min-width:0}
.pair{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:54px;overflow-wrap:anywhere}
.pair.sel{border-color:var(--un);background:var(--paper)}.pair.ok{background:var(--ok);color:var(--ok-ink);border-color:transparent}.pair.err{background:var(--no);color:var(--no-ink);border-color:var(--no-ink)}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bucket{min-height:130px;border:2px dashed var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;font-size:1.05rem}
.bucket strong{font:800 1.5rem var(--display)}
.tile.sel{border-color:var(--un);outline:2px solid var(--un)}
.tag{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--ink);margin-bottom:4px}
.w-ok{color:var(--ok-ink);background:var(--ok);padding:1px 8px;border-radius:6px}.w-no{color:var(--no-ink);background:var(--no);padding:1px 8px;border-radius:6px;text-decoration:line-through}
.hid{background:var(--line);color:transparent;border-radius:6px;cursor:pointer;user-select:none;padding:0 6px}
.btns{display:flex;gap:8px;flex-shrink:0}
h3{font-size:1.05rem;margin-top:18px}
.sub{font-size:1.15rem;color:var(--soft)}
.art{font:800 1.4rem var(--display);color:var(--un);align-self:center;margin-right:4px}
@media (max-width:430px){.row{flex-wrap:wrap}.btns{width:100%}.btns>*{flex:1}}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:56px;height:56px;border-radius:14px;box-shadow:0 0 0 1px var(--line)}
</style>

<main id="app" aria-live="polite"></main>

 {id:'3.1',title:'C’est moi! Mon école',topics:[
  {id:'salut',name:'Begrüssen',items:[['Salut, comment ça va?','Hallo, wie geht es?'],['Bonjour, comment ça va?','Guten Tag, wie geht es?'],['Ça va très bien.','Es geht sehr gut.'],['Ça va bien.','Es geht gut.'],['Ça va comme ci comme ça.','Es geht so lala.'],['Ça va mal.','Es geht schlecht.'],['Merci, ça va.','Danke, es geht.'],['Et toi?','Und dir?']]},

  {id:'moi',name:'Mich vorstellen',items:[['Comment tu t’appelles?','Wie heisst du?'],['Je m’appelle Marceau.','Ich heisse Marceau.'],['Tu as quel âge?','Wie alt bist du?'],['J’ai neuf ans.','Ich bin neun Jahre alt.'],['Tu habites où?','Wo wohnst du?'],['J’habite en Suisse.','Ich wohne in der Schweiz.'],['J’habite à Fribourg.','Ich wohne in Freiburg.']]},

const RULES={
 'un / une':{t:'un oder une: ein, eine',x:'Jedes Nomen ist männlich oder weiblich, aber nicht immer gleich wie im Deutschen. Männlich: un. Weiblich: une. Lerne darum jedes Nomen mit seinem Begleiter.',ex:[['un stylo','ein Stift'],['une gomme','ein Radiergummi'],['un livre','ein Buch'],['une chaise','ein Stuhl']]},
 'Je oder J’':{t:'je oder j’: ich',x:'Vor einem Vokal (a, e, i, o, u) oder einem h fällt das e von je weg. Dann schreibt man j’.',ex:[['j’ai neuf ans','ich bin neun Jahre alt'],['j’habite à Fribourg','ich wohne in Freiburg'],['je m’appelle Marceau','ich heisse Marceau']]},
 'Mehrzahl':{t:'Mehrzahl und Kleinschreibung',x:'In der Mehrzahl wird un und une zu des. Das Nomen bekommt meistens ein s, das man nicht hört. Französische Nomen schreibt man klein.',ex:[['un crayon → des crayons','ein Bleistift → Bleistifte'],['une chaise → des chaises','ein Stuhl → Stühle'],['une école','eine Schule (klein geschrieben)']]},
 'le / la / l’ / les':{t:'le, la, l’, les: der, die, das',x:'Männlich: le. Weiblich: la. Vor einem Vokal oder h: l’. In der Mehrzahl immer les.',ex:[['le chat','die Katze'],['la forêt','der Wald'],['l’animal','das Tier'],['les vaches','die Kühe']]},
 'Wo ist das Tier?':{t:'Wo ist etwas?',x:'Diese kleinen Wörter sagen, wo etwas ist. Sie stehen vor dem Ort.',ex:[['sur l’arbre','auf dem Baum'],['sous l’arbre','unter dem Baum'],['devant la maison','vor dem Haus'],['derrière la ferme','hinter dem Bauernhof'],['dans le jardin','im Garten']]},
 'mon / ma / mes':{t:'mon, ma, mes: mein, meine',x:'mon steht vor männlichen Nomen, ma vor weiblichen, mes vor der Mehrzahl.',ex:[['mon pays','mein Land'],['ma langue','meine Sprache'],['mes langues','meine Sprachen']]},
 'Das c':{t:'Wie spricht man das c?',x:'Vor a, o, u klingt c wie k. Vor e und i klingt c wie s. Mit Häkchen (ç) klingt es immer wie s.',ex:[['les carottes, couper','wie k'],['la cerise, la recette','wie s'],['ça, français','wie s']]},
 'Verben auf -er':{t:'Verben auf -er',x:'Viele französische Verben enden in der Grundform auf -er. So stehen sie im Wörterbuch.',ex:[['couper','schneiden'],['mélanger','mischen'],['ajouter','hinzugeben']]},
 'il / elle / on':{t:'il, elle, on: er, sie, man',x:'il ersetzt ein männliches Nomen, elle ein weibliches. on heisst man oder wir.',ex:[['le loup → il','der Wolf → er'],['la fille → elle','das Mädchen → sie'],['on nage','man schwimmt, wir schwimmen']]},
 'Verb mit il, elle, on':{t:'Verb mit il, elle, on',x:'Bei Verben auf -er fällt das -r weg: porter wird zu il porte. Das -e am Ende hört man nicht.',ex:[['porter → il porte','tragen → er trägt'],['nager → elle nage','schwimmen → sie schwimmt'],['dessiner → on dessine','malen → man malt']]},
 'jouer à / jouer de':{t:'jouer de oder jouer à',x:'Bei Instrumenten heisst es jouer de. Aus de + le wird du. Bei Spielen heisst es jouer à. Aus à + les wird aux.',ex:[['jouer du piano','Klavier spielen'],['jouer de la guitare','Gitarre spielen'],['jouer aux cartes','Karten spielen'],['jouer à la console','gamen']]},
 'ton / ta / tes, son / sa / ses':{t:'ton, ta, tes und son, sa, ses',x:'ton, ta, tes heisst dein oder deine. son, sa, ses heisst sein oder ihr. Die Form richtet sich nach dem Nomen, nicht nach der Person.',ex:[['ton hobby','dein Hobby'],['ta passion','dein allergrösstes Hobby'],['son hobby','sein oder ihr Hobby'],['ses hobbys','seine oder ihre Hobbys']]},
 'ce / cet / cette / ces':{t:'ce, cet, cette, ces: dieser, diese, dieses',x:'Männlich: ce. Männlich vor einem Vokal: cet. Weiblich: cette. Mehrzahl: ces.',ex:[['ce robot','dieser Roboter'],['cet enseignant','dieser Lehrer'],['cette roue','dieses Rad'],['ces antennes','diese Antennen']]},
 'Berufe weiblich':{t:'Berufe: männlich und weiblich',x:'Viele Berufe haben eine weibliche Form. Oft ändert sich nur die Endung.',ex:[['le policier → la policière','-ier wird -ière'],['le vendeur → la vendeuse','-eur wird -euse'],['le paysan → la paysanne','-an wird -anne'],['l’enseignant → l’enseignante','ein e kommt dazu']]},
 'Il faut …':{t:'il faut und il peut',x:'il faut heisst man muss, il peut heisst er kann. Danach kommt das Verb in der Grundform.',ex:[['Il faut appuyer sur le bouton.','Man muss auf den Knopf drücken.'],['Il peut nettoyer.','Er kann putzen.']]},
 'Il fait / Il y a':{t:'il fait oder il y a',x:'il fait steht vor Wörtern wie chaud, froid oder beau temps. il y a steht vor einem Nomen mit du, de la oder des. Regen und Schnee haben eigene Verben.',ex:[['Il fait froid.','Es ist kalt.'],['Il y a du vent.','Es windet.'],['Il y a des nuages.','Es hat Wolken.'],['Il pleut. Il neige.','Es regnet. Es schneit.']]},
 'Fragen':{t:'Fragen mit est-ce que',x:'Setze Est-ce que vor einen Satz, dann wird er zur Frage. Vor einem Vokal wird que zu qu’.',ex:[['Tu regardes la météo. → Est-ce que tu regardes la météo?','Schaust du den Wetterbericht?'],['Il neige. → Est-ce qu’il neige?','Schneit es?']]},
 'Verb mit tu':{t:'Verb mit tu: du',x:'Bei Verben auf -er endet die Form mit tu auf -es. Das s hört man nicht.',ex:[['regarder → tu regardes','du schaust'],['terminer → tu termines','du beendest']]},
 'Verb mit vous':{t:'Verb mit vous: ihr oder Sie',x:'Bei Verben auf -er endet die Form mit vous auf -ez. Das klingt wie é.',ex:[['fermer → vous fermez','ihr schliesst'],['entrer → vous entrez','ihr kommt herein'],['monter → vous montez','ihr steigt hinauf']]},
 'le / la / l’ im Haus':{t:'le, la, l’ im Haus',x:'Auch Räume und Möbel haben le, la oder l’. Vor einem Vokal steht l’.',ex:[['la chambre','das Zimmer'],['le lit','das Bett'],['l’armoire','der Schrank'],['l’escalier','die Treppe']]},
 'Zahlen bis 1000':{t:'Zahlen von 13 bis 1000',x:'Ab 70 rechnet man auf Französisch: 60 + 10, 4 × 20, 4 × 20 + 10. In der Romandie sagt man einfacher septante (70) und nonante (90), oft auch huitante (80).',ex:[['vingt et un','21'],['soixante-dix','70 (septante)'],['quatre-vingts','80 (huitante)'],['quatre-vingt-dix','90 (nonante)'],['cent, mille','100, 1000']]},
 'en / au + Monat und Jahreszeit':{t:'en oder au: wann?',x:'Vor Monaten und den meisten Jahreszeiten steht en. Nur beim Frühling heisst es au printemps.',ex:[['en mars','im März'],['en été','im Sommer'],['en hiver','im Winter'],['au printemps','im Frühling']]},
 'Fragewörter':{t:'Fragewörter',x:'Mit diesen Wörtern fragst du nach Informationen zu einer Veranstaltung.',ex:[['Quoi?','Was?'],['Où?','Wo?'],['Quand?','Wann?'],['Combien?','Wie viel?'],['Comment?','Wie?'],['Que faire?','Was tun?']]},
 'Das c und ç':{t:'c und ç',x:'Vor a, o, u klingt c wie k. Vor e und i klingt c wie s. Soll c vor a, o, u wie s klingen, bekommt es ein Häkchen: ç.',ex:[['le concours, la curiosité','wie k'],['décembre, la cerise','wie s'],['ça, français','ç klingt wie s']]},
 'Befehlsform':{t:'Befehlsform: Mach das!',x:'Zu einer Person: Bei Verben auf -er fällt das -r weg. Zu mehreren oder höflich: Endung -ez.',ex:[['plier → Plie! / Pliez!','Falte! / Faltet!'],['toucher → Touche! / Touchez!','Berühre! / Berührt!'],['fermer → Ferme! / Fermez!','Schliesse! / Schliesst!']]},
 'il faut + Grundform':{t:'il faut',x:'il faut heisst man muss. Danach steht das Verb in der Grundform. il te faut + Nomen heisst du brauchst.',ex:[['Il faut remplir le verre.','Man muss das Glas füllen.'],['Il te faut une cuillère.','Du brauchst einen Löffel.']]},
 'Verneinung':{t:'Verneinung: ne … pas',x:'ne steht vor dem Verb, pas dahinter. Vor einem Vokal wird ne zu n’. Statt pas gibt es auch rien (nichts) und jamais (nie).',ex:[['Je ne travaille pas.','Ich arbeite nicht.'],['Il ne sait pas lire.','Er kann nicht lesen.'],['Je n’entends rien.','Ich höre nichts.']]},
 'Verben auf -er im Präsens':{t:'Verben auf -er: alle Formen',x:'Die Grundform verliert -er und bekommt eine Endung. Bei je, tu, il und ils hört man die Endung nicht.',ex:[['je joue, tu joues','ich spiele, du spielst'],['il / elle / on joue','er / sie / man spielt'],['nous jouons, vous jouez','wir spielen, ihr spielt'],['ils / elles jouent','sie spielen']]}

// Online-Speicher in einem privaten GitHub-Gist
const GH_DESC='Petit Parcours Fortschritt',GH_FILE='progress.json';
let ghTok=null,ghId=null,ghErr='',ghBusy=false,ghT=null;
try{ghTok=localStorage.getItem('pp-gh-token');ghId=localStorage.getItem('pp-gh-id')}catch(e){}
async function ghApi(path,opt={}){const r=await fetch('https://api.github.com'+path,{...opt,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+ghTok,...(opt.body?{'Content-Type':'application/json'}:{})}});
 if(!r.ok)throw new Error(r.status===401?'Der Schlüssel ist ungültig oder abgelaufen.':r.status===403||r.status===404?'Der Schlüssel darf keine Gists bearbeiten.':'GitHub antwortet nicht ('+r.status+').');return r.json()}
async function ghInit(){if(!ghTok||!ghId)return;
 try{const g=await ghApi('/gists/'+ghId);const f=g.files&&g.files[GH_FILE];let txt=f&&f.content;if(f&&f.truncated)txt=await (await fetch(f.raw_url)).text();
  if(txt){const d=JSON.parse(txt);if(d&&d.items)S=merge(S,d)}store='github';ghErr='';try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
 catch(e){ghErr=e.message||'Keine Verbindung zu GitHub.'}}
function ghPush(){if(!ghTok||!ghId||TEST)return;clearTimeout(ghT);ghT=setTimeout(async()=>{try{await ghApi('/gists/'+ghId,{method:'PATCH',body:JSON.stringify({files:{[GH_FILE]:{content:JSON.stringify(S)}}})});if(ghErr){ghErr='';if(!R)render()}}catch(e){ghErr=e.message||'Speichern bei GitHub fehlgeschlagen.';if(!R)render()}},1500)}
async function ghConnect(tok){ghTok=tok.trim();ghErr='';ghBusy=true;render();
 try{let gists=await ghApi('/gists?per_page=100');let g=gists.find(x=>x.description===GH_DESC&&x.files&&x.files[GH_FILE]);
  if(!g)g=await ghApi('/gists',{method:'POST',body:JSON.stringify({description:GH_DESC,public:false,files:{[GH_FILE]:{content:JSON.stringify(S)}}})});
  ghId=g.id;try{localStorage.setItem('pp-gh-token',ghTok);localStorage.setItem('pp-gh-id',ghId)}catch(e){}
  await ghInit();if(!ghErr){save();bkMsg='Verbunden. Der Fortschritt wird ab jetzt online gespeichert.'}}

function ghOff(){ghTok=null;ghId=null;store='local';try{localStorage.removeItem('pp-gh-token');localStorage.removeItem('pp-gh-id')}catch(e){}render()}

const PIN_DESC='Petit Parcours Schlüssel',PIN_FILE='schluessel.json',PIN_IT=600000;
const GH_USER=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'petitparcours';
let pinMsg='',pinBusy=false,pinMode=false;
const b64e=b=>btoa(String.fromCharCode(...new Uint8Array(b))),b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pinKey(pin,salt,it){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function pinSet(pin){pin=pin.trim();if(pin.length<4){pinMsg='Die PIN braucht mindestens 4 Zeichen.';return render()}
 pinBusy=true;pinMsg='';render();
 try{const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await pinKey(pin,salt,PIN_IT);const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify({t:ghTok,g:ghId})));
  const content=JSON.stringify({v:1,it:PIN_IT,salt:b64e(salt),iv:b64e(iv),data:b64e(data)});
  const gists=await ghApi('/gists?per_page=100');const g=gists.find(x=>x.description===PIN_DESC);
  if(g)await ghApi('/gists/'+g.id,{method:'PATCH',body:JSON.stringify({files:{[PIN_FILE]:{content}}})});
  else await ghApi('/gists',{method:'POST',body:JSON.stringify({description:PIN_DESC,public:true,files:{[PIN_FILE]:{content}}})});
  pinMode=false;pinMsg='Die PIN ist gespeichert. Auf anderen Geräten genügt jetzt diese PIN.'}
 catch(e){pinMsg=e.message||'Die PIN konnte nicht gespeichert werden.'}
 pinBusy=false;render()}
async function pinConnect(pin){pin=pin.trim();if(!pin)return;pinBusy=true;pinMsg='';ghErr='';render();
 try{const pub=async p=>{const r=await fetch('https://api.github.com'+p,{headers:{'Accept':'application/vnd.github+json'}});if(!r.ok)throw new Error('GitHub antwortet nicht ('+r.status+').');return r.json()};

function buildRound(magFilter){

 const old=[...due,...seen];

}

function pairClick(side,i,t){const st=R.sub;if(R.state!=='ask'||st.done.includes(i))return;

 if(li===ri){st.done.push(li);if(side==='r')speak(t.items[li].fr)}
 else{st.err[li]=(st.err[li]||0)+1;st.err[ri]=(st.err[ri]||0)+1;st.flash=[li,ri];setTimeout(()=>{if(R&&R.sub===st&&st.flash){st.flash=null;if(R.state==='ask')renderTask()}},650)}

function checkType(t){if(R.state!=='ask')return;const v=$('#ans').value;if(!v.trim())return;const a=norm(t.answer),g=norm(v);

 if(noAcc(g)===noAcc(a)){R.state='done';record(t,true);$('#ans').disabled=true;return feedback(true,t,'Achte auf die Zeichen: '+t.answer)}
 const art=t.answer.match(/^(un|une|le|la|les|l’|des|mon|ma|mes|ce|cette|ces) ?(.*)$/);
 if(!R.tried&&art&&art[2]&&noAcc(g)===noAcc(art[2])){R.tried=true;$('#fb').innerHTML='<div class="fb no">Das Wort stimmt. Schreib den Begleiter davor (zum Beispiel le, la oder un).</div>';return}

function renderEnd(){S.rounds++;S.last=Date.now();save();const r=R,done=r.tasks.filter(t=>!t.retry).length;R0mission=r.mission;
 app.innerHTML=`<section class="task"><h1>Fertig.</h1><p class="prompt">${Math.min(r.first,done)} von ${done}</p><p class="muted">beim ersten Anlauf richtig. ${TEST?'Testmodus: Es wurde nichts gespeichert.':'Die Karteibox ist aktualisiert.'}</p>
 <div class="start" style="padding:16px"><strong>Mini-Mission, etwa 1 Minute</strong><p class="muted">${esc((MISSIONS[r.mission]||MISSIONS['3.1']).task)}</p><button class="plain" id="mission">Mini-Mission machen</button></div>
 <div class="actions"><button class="big" id="done">Zur Übersicht</button><button class="plain" id="again">Noch eine Runde</button></div></section>`;
 $('#done').onclick=()=>{R=null;view='home';render()};$('#again').onclick=()=>{R=buildRound(r.magFilter);renderTask()};$('#mission').onclick=()=>{R=null;view='mission';render()}}

// Arbeitsblatt: 8 Übungen, Lösungen separat
function uniq(list){const f=new Set(),d=new Set();return list.filter(i=>{if(f.has(i.fr)||d.has(i.de))return false;f.add(i.fr);d.add(i.de);return true})}
function makeSheetData(){const mags=[...sheetMags].sort(),all=uniq(ITEMS.filter(i=>sheetMags.has(i.mag))),used=new Set();
 const pick=(list,n)=>{const r=[...shuffle(list.filter(i=>!used.has(i.id))),...shuffle(list.filter(i=>used.has(i.id)))].slice(0,n);r.forEach(i=>used.add(i.id));return r};
 const match=pick(all.filter(i=>i.fr.length<=24&&i.de.length<=30),8);
 const nouns=pick(all.filter(i=>/^(un|une|le|la|les) /.test(i.fr)&&!/[.?!,]/.test(i.fr)&&i.fr.split(' ').length<=4&&i.fr===i.fr.toLowerCase()),8).map(i=>{const [a,w]=splitArt(i.fr);return{a,w,de:i.de,hint:a==='un'||a==='une'?'un / une':'le / la / les'}});
 const gram=shuffle(GRAMMAR.filter(g=>sheetMags.has(g.mag)&&g.skill!=='Das c')).slice(0,8);
 const gaps=pick(all.filter(gapInfo),6).map(gapInfo);
 const bank=shuffle([...gaps.map(g=>g.word),...shuffle(wordsFrom(all,gaps.map(g=>g.word))).slice(0,2)]);
 const order=pick(all.filter(i=>{const n=i.fr.split(' ').length;return n>=3&&n<=7}),4).map(i=>({fr:i.fr,parts:scramble(i.fr.split(' '))}));
 const letters=pick(all.filter(lettersWord),6).map(i=>{const lw=lettersWord(i);return{...lw,de:i.de,mix:scramble([...lw.w]).join(' ')}});
 const trans=pick(all.filter(i=>i.fr.length<=40),6);
 return{mags,match,right:shuffle(match),nouns,gram,gaps,bank,order,letters,trans,mission:MISSIONS[mags[mags.length-1]]}}
const pdfT=s=>String(s).replace(/’/g,"'").replace(/…/g,'...').replace(/→/g,'->').replace(/–/g,'-').replace(/«|»/g,'"');
function buildPDF(d){const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),L=20,W=170,B=280;let y=20,n=0;
 const font=(s,b,c)=>{doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(s);doc.setTextColor(c==null?0:c)};
 const T=(t,x,yy)=>doc.text(pdfT(t),x,yy);
 const need=h=>{if(y+h>B){doc.addPage();y=20}};
 const H=(t,sub,block)=>{need(14+(block||0));n++;font(13.5,1);T(n+'. '+t,L,y);y+=5.5;if(sub){font(10,0,100);T(sub,L,y);y+=5}y+=3;font(12.5)};
 const rule=(x,w)=>{doc.setDrawColor(150);doc.line(x,y,x+w,y)};
 font(20,1);T('Mon petit parcours',L,y);y+=7;font(11);T('Mille feuilles '+d.mags.join(', ')+'      Name: ____________________      Datum: ___________',L,y);y+=11;
 H('Verbinde mit einem Strich.','',d.match.length*8.5);
 d.match.forEach((m,i)=>{T(m.fr,L,y);doc.circle(L+70,y-1.3,1,'S');doc.circle(L+88,y-1.3,1,'S');T(d.right[i].de,L+92,y);y+=8.5});y+=3;
 if(d.nouns.length){H('Schreib den Begleiter davor.','Die Wahl steht in Klammern.',Math.ceil(d.nouns.length/2)*12);
  for(let i=0;i<d.nouns.length;i+=2){need(12);[d.nouns[i],d.nouns[i+1]].forEach((x,k)=>{if(!x)return;const X=L+k*86;font(12.5);T('_______ '+x.w,X,y);font(9.5,0,110);T('('+x.hint+')  '+x.de,X,y+4.8)});y+=12}y+=2}
 if(d.gram.length){H('Kreuze an, was passt.');d.gram.forEach((g,k)=>{font(12.5);const pl=doc.splitTextToSize(pdfT(g.prompt),W);need(10+pl.length*6+8);font(10,0,100);T((k+1)+') '+g.ask,L,y);y+=5.5;font(12.5);doc.text(pl,L,y);y+=pl.length*6+1;let x=L;g.options.forEach(o=>{const s=pdfT(o),w=doc.getTextWidth(s)+12;if(x+w>L+W){x=L;y+=7}doc.setDrawColor(60);doc.rect(x,y-3.6,4,4);doc.text(s,x+6,y);x+=w+4});y+=9})}
 if(d.gaps.length){H('Setze das passende Wort ein.','Zwei Wörter im Kasten bleiben übrig.',24);
  font(12.5);const bl=doc.splitTextToSize(pdfT(d.bank.join('      ')),W-8);doc.setDrawColor(120);doc.rect(L,y-5,W,bl.length*6+3.5);doc.text(bl,L+4,y);y+=bl.length*6+5;
  d.gaps.forEach((g,k)=>{font(12.5);const sl=doc.splitTextToSize(pdfT((k+1)+') '+g.shown),W);need(sl.length*6+8);doc.text(sl,L,y);y+=sl.length*6-1;font(9.5,0,110);T(g.de,L+5,y);y+=7.5});y+=2}
 H('Bring die Wörter in die richtige Reihenfolge.','',18);
 d.order.forEach((o,k)=>{need(18);font(12.5);const sl=doc.splitTextToSize(pdfT((k+1)+') '+o.parts.join('   /   ')),W);doc.text(sl,L,y);y+=sl.length*6+5;rule(L,W);y+=8});
 if(d.letters.length){H('Buchstabensalat: Schreib das Wort richtig.','',17);for(let i=0;i<d.letters.length;i+=2){need(19);[d.letters[i],d.letters[i+1]].forEach((x,k)=>{if(!x)return;const X=L+k*86;font(9.5,0,110);T(x.de,X,y);font(12.5);T((x.art?x.art+'   ':'')+x.mix,X,y+6);doc.setDrawColor(150);doc.line(X,y+13,X+75,y+13)});y+=20}}
 H('Schreib auf Französisch.','',15);d.trans.forEach(t=>{need(15);font(12.5);T(t.de,L,y);y+=7;rule(L,W);y+=8});
 if(d.mission){H('Schreib selbst.',d.mission.task,32);[0,1,2].forEach(()=>{y+=9;rule(L,W)});y+=6}
 doc.addPage();y=20;font(20,1);T('Lösungen',L,y);y+=11;n=0;
 const A=(h,lines)=>{need(16);n++;font(13,1);T(n+'. '+h,L,y);y+=7;font(11.5);lines.forEach(l=>{const sl=doc.splitTextToSize(pdfT(l),W);need(sl.length*5.5+1);doc.text(sl,L,y);y+=sl.length*5.5+.6});y+=4};
 A('Verbinden',d.match.map(m=>m.fr+'  =  '+m.de));
 if(d.nouns.length)A('Begleiter',d.nouns.map(x=>x.a+' '+x.w));
 if(d.gram.length)A('Ankreuzen',d.gram.map((g,k)=>(k+1)+') '+g.answer+'   ('+g.why+')'));
 if(d.gaps.length)A('Passendes Wort',d.gaps.map((g,k)=>(k+1)+') '+g.fr));
 A('Reihenfolge',d.order.map((o,k)=>(k+1)+') '+o.fr));
 if(d.letters.length)A('Buchstabensalat',d.letters.map(x=>(x.art?x.art+(x.art.endsWith('’')?'':' '):'')+x.w));
 A('Französisch',d.trans.map(t=>t.de+'  =  '+t.fr));
 if(d.mission)A('Schreib selbst (ein Beispiel)',d.mission.model);
 return doc}
async function makeSheet(){msg='';if(!window.jspdf){msg='Das PDF-Werkzeug konnte nicht laden. Prüfe die Internetverbindung und lade die Seite neu.';return render()}
 const doc=buildPDF(makeSheetData()),blob=doc.output('blob');
 if(STANDALONE||!window.claude?.use){doc.save('arbeitsblatt-franzoesisch.pdf');sheetDone=true;msg='Das PDF ist gespeichert. Die Lösungen beginnen auf einer neuen Seite.';return render()}
 if(!downloads)downloads=await window.claude.use('downloads');
 if(!downloads){msg='In dieser Ansicht kann die Seite keine Dateien speichern. Öffne sie in Claude.';window.__lastPdf=blob;return render()}
 try{await downloads.save({filename:'arbeitsblatt-franzoesisch.pdf',data:blob});sheetDone=true;msg='Das PDF ist gespeichert. Die Lösungen beginnen auf einer neuen Seite.'}catch(e){msg=e&&e.code==='declined'?'Das PDF wurde nicht gespeichert.':'Das PDF konnte nicht gespeichert werden.'}render()}
function paperDone(ok){ITEMS.filter(i=>sheetMags.has(i.mag)).forEach(i=>{const c=S.items[i.id];if(c&&!ok)c.next=now()});save();sheetDone=false;msg='Danke, die Karteibox ist aktualisiert.';render()}

if('serviceWorker' in navigator)try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
loadLocal();if(!S.rules)S.rules={};try{window.speechSynthesis?.getVoices()}catch(e){};render();
window.__pp={GRAMMAR,ITEMS,MAGS,RULES,buildRound,makeSheetData,buildPDF,get S(){return S},set S(v){S=v},get R(){return R}};
